<!DOCTYPE html>
<!-- 5枚目: 安心して使えること＋ひらき方 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="slide.css">
<style>
  .title h1 { font-size: 58px; }
  .list { position: absolute; top: 290px; left: 80px; right: 80px; display: flex; flex-direction: column; gap: 28px; }
  .item {
    display: flex; align-items: center; gap: 30px;
    background: #ffffff; border: 4px solid #e9d5ff; border-radius: 34px; padding: 28px 36px;
  }
  .mark {
    flex: none; width: 96px; height: 96px; border-radius: 50%; background: #f3e8ff; border: 4px solid #c084fc;
    display: grid; place-items: center;
  }
  .mark svg { width: 48px; height: 48px; }
  .item h2 { font-size: 40px; font-weight: 700; line-height: 1.35; }
  .item p { margin-top: 6px; font-size: 28px; color: #6b5a7a; line-height: 1.5; }
  .cta {
    position: absolute; left: 80px; right: 80px; top: 970px; height: 250px;
    background: #7e22ce; color: #ffffff; border-radius: 40px;
    display: flex; align-items: center; justify-content: center; gap: 34px;
    box-shadow: 0 18px 40px rgba(126, 34, 206, .3);
  }
  .cta img { width: 140px; height: 140px; filter: drop-shadow(0 6px 14px rgba(46, 16, 72, .35)); }
  .cta .big { font-size: 48px; font-weight: 700; }
  .cta .url { margin-top: 10px; font-size: 32px; color: #f3e8ff; letter-spacing: .01em; }
</style>
</head>
<body>
  <div class="page">5 / 5</div>
  <div class="title"><h1>安心して お使いいただけるように</h1></div>

  <div class="list">
    <div class="item">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#7e22ce" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
      <div><h2>入力した内容は 送られません</h2><p>計算は、お使いのスマホ・パソコンの中だけで行います</p></div>
    </div>
    <div class="item">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#7e22ce" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div><h2>無料・会員登録なし</h2><p>アプリのインストールも いりません</p></div>
    </div>
    <div class="item">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#7e22ce" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></div>
      <div><h2>お寺や地域で 日程は異なります</h2><p>最終的な日程は、菩提寺へご相談ください</p></div>
    </div>
  </div>

  <div class="cta">
    <img src="../../favicon.svg" alt="">
    <div>
      <div class="big">プロフィールのリンクから</div>
      <div class="url">tomurai-cal.onga-mirai-tech.com</div>
    </div>
  </div>
</body>
</html>
