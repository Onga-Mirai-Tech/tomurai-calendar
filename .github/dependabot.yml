# GitHub Actions の部品（actions/checkout など）の新しい版が出たら、更新の Pull Request を作る。
# 部品は安全のため版（コミットのハッシュ）を固定しているので、自動では新しくならない。
# 届いた Pull Request は、テストが通ったのを確かめてから手動でマージする。
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" は .github/workflows/ を見る。デプロイ用の部品（.github/actions/deploy-xserver/action.yml）の中で
    # 使っている actions/setup-node なども更新されるよう、.github/actions/ の下も対象にする
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    # 同じ部品の更新は1つの Pull Request にまとめる（workflows と action.yml で別々に届かないように）
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "Actions 更新"
    labels: []
