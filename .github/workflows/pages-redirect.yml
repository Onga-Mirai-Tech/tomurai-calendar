# 独自ドメインへの移行完了後に「手動で1回だけ」実行し、
# 旧URL（GitHub Pages）を新URLへの転送ページに置き換える。
# 事前に Settings > Pages > Build and deployment > Source を
# 「GitHub Actions」に切り替えておくこと。手順は docs/deploy-xserver.md を参照。
name: GitHub Pages redirect

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Onga-Mirai-Tech/tomurai-calendar'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare redirect site
        run: |
          mkdir -p _site
          cp pages-redirect/index.html _site/index.html
          # 旧URLの配下どこにアクセスされても転送されるよう、404.html にも同じ内容を置く
          cp pages-redirect/index.html _site/404.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
