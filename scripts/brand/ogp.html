<!DOCTYPE html>
<!--
  リンクを貼り付けたときに表示されるカード画像（OGP画像 / ogp.png, 1200x630）の元デザイン。
  変更したら scripts/brand/generate.sh で作り直す。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    color: #3b2a4a;
    background: linear-gradient(135deg, #f5f3f7 0%, #ede4f7 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 1120px; height: 550px; position: relative;
    background: #ffffff; border: 4px solid #e9d5ff; border-radius: 44px;
    box-shadow: 0 18px 44px rgba(107, 33, 168, .14);
    display: flex; align-items: center; gap: 48px; padding: 0 56px 56px 76px;
  }
  .icon { width: 240px; height: 240px; flex: none; filter: drop-shadow(0 12px 22px rgba(126, 34, 206, .28)); }
  .text { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 88px; font-weight: 600; line-height: 1.05; letter-spacing: .04em; color: #6b21a8; white-space: nowrap;
  }
  .sub { font-size: 40px; font-weight: 700; line-height: 1.45; }
  .tags { display: flex; flex-wrap: wrap; gap: 10px 12px; margin-top: 4px; }
  .tag {
    font-size: 25px; font-weight: 700; white-space: nowrap; color: #581c87;
    background: #f3e8ff; border: 2px solid #c084fc; border-radius: 999px; padding: 5px 18px;
  }
  .foot {
    position: absolute; left: 0; right: 0; bottom: 26px; text-align: center;
    font-size: 23px; color: #6b5a7a; letter-spacing: .02em;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="../../favicon.svg" alt="">
    <div class="text">
      <h1>弔いカレンダー</h1>
      <p class="sub">没年月日を入れるだけで<br>法要の日程を自動で計算</p>
      <div class="tags">
        <span class="tag">初七日〜五十回忌</span>
        <span class="tag">カレンダーに登録</span>
        <span class="tag">印刷・PDF</span>
      </div>
    </div>
    <p class="foot">tomurai-cal.onga-mirai-tech.com ・ 計算はお使いの端末の中だけで行います</p>
  </div>
</body>
</html>
